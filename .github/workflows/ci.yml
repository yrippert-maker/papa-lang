name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt || true
      - run: python3 papa.py run examples/01_hello.papa
      - run: python3 papa.py run examples/02_safety.papa
      - run: python3 papa.py run examples/05_full_demo.papa
      - run: python3 -m pytest tests/ -v || true
